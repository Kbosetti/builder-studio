<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Home Portrait | Mitchell Homes</title>
<style>
@font-face{font-family:'Montserrat';src:url(/fonts/montserrat.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Montserrat';src:url(/fonts/montserrat-italic.woff2) format('woff2');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Charlotte';src:url(/fonts/charlotte.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap;}
</style>
<style>
:root{
  --green:#2b6d47;
  --green-deep:#1e4f33;
  --yellow:#f5d053;
  --cream:#faf8f3;
  --ink:#1c2420;
  --grey:#6d746f;
  --line:#e3ded2;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--ink);
  overflow:hidden;
}
.script{font-family:'Charlotte',cursive;color:var(--green);}

/* Top chrome */
.chrome{
  position:fixed;top:0;left:0;right:0;z-index:30;
  padding:calc(10px + env(safe-area-inset-top)) 18px 0;
}
.segs{display:flex;gap:5px;margin-bottom:10px;}
.seg{flex:1;height:3.5px;border-radius:2px;background:rgba(109,116,111,.28);overflow:hidden;}
.segfill{height:100%;width:0;background:var(--yellow);border-radius:2px;}
.chromerow{display:flex;justify-content:space-between;align-items:center;}
.logo{height:44px;width:auto;display:block;}
.logodark{display:none;}
body.ondark .logodark{display:block;}
body.ondark .logolight{display:none;}
.doc-tag{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);transition:color .4s;}
body.ondark .doc-tag{color:#b9ccc0;}

/* Deck */
.deck{position:fixed;inset:0;}
.slide{
  position:absolute;inset:0;display:none;
  padding:calc(58px + env(safe-area-inset-top)) 22px calc(74px + env(safe-area-inset-bottom));
  background:var(--cream);
}
.slide.active{display:flex;flex-direction:column;justify-content:center;}
.slide.dark{background:var(--green-deep);color:#fff;}
.inner{
  width:100%;max-width:620px;margin:0 auto;
  max-height:100%;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:none;
}
.inner::-webkit-scrollbar{display:none;}
.inner > :last-child{margin-bottom:0;}

/* Stagger entrances */
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.slide.active .s1{animation:rise .55s ease backwards .1s;}
.slide.active .s2{animation:rise .55s ease backwards .3s;}
.slide.active .s3{animation:rise .55s ease backwards .5s;}
.slide.active .s4{animation:rise .55s ease backwards .7s;}
.slide.active .s5{animation:rise .55s ease backwards .9s;}
.slide.active .s6{animation:rise .55s ease backwards 1.1s;}
.slide.active .s7{animation:rise .55s ease backwards 1.3s;}
.slide.active .s8{animation:rise .55s ease backwards 1.5s;}

/* Type */
.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:12px;}
.slide.dark .eyebrow{color:var(--yellow);}
h1.cover-t{font-weight:300;font-size:clamp(36px,9vw,58px);line-height:1.08;letter-spacing:-0.5px;}
h1.cover-t .script{font-size:.98em;margin-left:.08em;}
h2.slide-t{font-weight:300;font-size:clamp(26px,6.6vw,40px);line-height:1.18;margin-bottom:14px;}
h2.slide-t .script{font-size:.95em;margin-left:.06em;}
.slide p.body{font-size:clamp(15px,4.2vw,17.5px);line-height:1.75;color:#333b36;margin-bottom:14px;font-weight:400;}
.slide.dark p.body{color:#e7efe9;font-weight:300;}
.slide p.body b{color:var(--green-deep);}
.slide.dark p.body b{color:var(--yellow);}
.hl{background:linear-gradient(transparent 58%, rgba(245,208,83,.55) 58%);font-weight:600;color:var(--green-deep);}
.slide.dark .hl{background:linear-gradient(transparent 58%, rgba(245,208,83,.28) 58%);color:#fff;}
.prep{font-size:13.5px;color:var(--grey);line-height:1.7;margin-top:18px;}
.prep b{color:var(--green-deep);font-weight:600;}
.rule{height:2px;background:var(--yellow);width:64px;margin:22px 0;}
.center{text-align:center;}
.center .rule{margin:22px auto;}
.pull{
  font-family:'Charlotte',cursive;font-size:clamp(22px,6vw,30px);color:var(--green);line-height:1.25;
  border-left:3px solid var(--yellow);padding-left:18px;margin:24px 0 8px;
}

/* Photos */
.photo{border-radius:10px;overflow:hidden;box-shadow:0 12px 34px rgba(30,79,51,.16);margin-bottom:18px;background:#fff;}
.photo img{width:100%;display:block;max-height:36dvh;object-fit:cover;}
.photo .cap{font-family:'Charlotte',cursive;font-size:17px;color:var(--green-deep);padding:10px 16px 12px;line-height:1.2;}

/* Spaces cards */
.spaces{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
@media (max-width:560px){.spaces{grid-template-columns:1fr;}}
.space{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 16px;}
.space .s-t{font-weight:600;font-size:14.5px;color:var(--green-deep);margin-bottom:5px;}
.space .s-d{font-size:12.5px;color:var(--grey);line-height:1.55;}
.plans-note{font-size:12.5px;color:var(--grey);font-style:italic;margin-top:14px;line-height:1.6;}

/* Board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
@media (max-width:420px){.board{gap:8px;}}
.pin{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 3px 12px rgba(30,79,51,.06);}
.pin img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;}
.pin .cap{font-family:'Charlotte',cursive;font-size:14px;color:var(--green-deep);padding:7px 10px 9px;line-height:1.15;}
.pin.wide{grid-column:1/-1;}
.pin.wide img{aspect-ratio:21/9;}
@media (min-width:700px){
  .board{grid-template-columns:1fr 1fr 1fr;}
  .pin img{aspect-ratio:16/10;}
  .pin.wide{grid-column:span 2;}
  .pin.wide img{aspect-ratio:33/10;}
  .board-note{margin-top:8px;}
}
.board-note{font-size:11.5px;color:var(--grey);font-style:italic;margin-top:12px;line-height:1.6;}

/* Simply math */
.s-label{font-family:'Charlotte',cursive;color:var(--yellow);font-size:34px;line-height:1;margin-bottom:10px;}
.s-logo{display:block;height:38px;width:auto;margin-bottom:14px;}
.mathtable{width:100%;border-collapse:collapse;margin:14px 0 8px;}
.mathtable td{padding:11px 6px;font-size:clamp(13px,3.6vw,14.5px);border-bottom:1px solid rgba(255,255,255,.18);color:#e7efe9;}
.mathtable td:last-child{text-align:right;font-weight:600;color:#fff;white-space:nowrap;}
.mathtable tr.total td{border-bottom:none;border-top:2px solid var(--yellow);color:var(--yellow);font-weight:700;font-size:clamp(14px,4vw,16px);}
.fine{font-size:10.5px;color:#b9ccc0;margin-top:12px;line-height:1.55;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px;}
@media (max-width:520px){.stats{grid-template-columns:1fr;}}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 14px;text-align:center;}
.stat .n{font-weight:800;font-size:34px;color:var(--green-deep);}
.stat .n::after{content:"";display:block;width:34px;height:3px;background:var(--yellow);margin:7px auto 0;border-radius:2px;}
.stat .l{font-size:11.5px;color:var(--grey);margin-top:6px;line-height:1.45;}

/* Roadmap */
.step{display:flex;gap:16px;margin-bottom:15px;align-items:flex-start;}
.step .num{
  flex:0 0 34px;height:34px;border-radius:50%;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--green-deep);
}
.step .t{font-weight:600;font-size:15px;color:var(--green-deep);}
.step .d{font-size:13px;color:var(--grey);line-height:1.55;margin-top:2px;}

/* Listen */
.listen{list-style:none;margin-top:4px;}
.listen li{font-size:14.5px;padding:13px 0;border-bottom:1px solid var(--line);color:#333b36;}
.listen li b{color:var(--green-deep);}
.listen li span{color:var(--grey);font-size:12.5px;display:block;margin-top:3px;line-height:1.5;}

/* CTA */
.cta-box{
  border:1.5px solid var(--green);border-radius:10px;padding:26px 26px;margin-top:18px;
  background:#f2f7f3;text-align:center;
}
.cta-box .script{font-size:26px;display:block;margin-bottom:10px;}
.cta-box p{font-size:14px;margin-bottom:6px;line-height:1.6;}
.cta-box .addr{font-size:12.5px;color:var(--grey);margin-top:8px;line-height:1.6;}
.endnote{font-size:10px;color:var(--grey);text-align:center;line-height:1.7;margin-top:22px;}

.btn-book{display:inline-block;background:#2b6d47;color:#fff;text-decoration:none;padding:14px 30px;border-radius:4px;font-family:Arial,sans-serif;font-size:14px;letter-spacing:1px;font-weight:bold;}
.btn-book:hover{background:#1e4f33;}
/* Cover painting */
.painting{
  display:inline-block;background:#fdfbf5;padding:9px;
  border:7px solid #c9a03a;outline:2px solid #7c5f16;
  box-shadow:0 14px 34px rgba(30,79,51,.22);margin:16px auto 0;
}
.painting img{display:block;max-height:26dvh;max-width:100%;width:auto;margin:0 auto;}
.cover-cap{font-family:'Charlotte',cursive;font-size:clamp(17px,4vw,23px);color:var(--green);margin-top:14px;line-height:1.2;}
@media (min-width:900px){.painting img{max-height:36dvh;}}

/* Hint + controls */
.hint{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);margin-top:26px;animation:pulse 2.2s ease infinite;}
@keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}
.controls{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 16px calc(14px + env(safe-area-inset-bottom));
}
.navbtn{
  width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
  color:var(--green-deep);font-size:20px;cursor:pointer;font-family:'Montserrat',sans-serif;
  display:flex;align-items:center;justify-content:center;transition:border-color .2s, opacity .3s;
  box-shadow:0 4px 14px rgba(30,79,51,.1);
}
.navbtn:hover{border-color:var(--green);}
.navbtn:disabled{opacity:.25;cursor:default;}
.cnt{font-size:11px;letter-spacing:1.5px;color:var(--grey);text-transform:uppercase;transition:color .4s;}
body.ondark .cnt{color:#b9ccc0;}
body.ondark .navbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:none;}

/* Desktop layout */
@media (min-width:900px){
  .inner{max-width:780px;}
  .slide.wide .inner{max-width:980px;}
  h2.slide-t{font-size:clamp(30px,3.4vw,46px);}
  .slide p.body{font-size:18px;line-height:1.8;}
  .eyebrow{font-size:12px;}
  .slide.split .inner{
    display:grid;grid-template-columns:1.05fr 1fr;gap:8px 56px;
    align-items:center;max-width:1060px;
  }
  .slide.split .txt{grid-column:1;align-self:end;}
  .slide.split .txt2{grid-column:1;align-self:start;}
  .slide.split .photo{grid-column:2;grid-row:1/3;margin:0;}
  .slide.split .photo img{max-height:56dvh;aspect-ratio:4/3.4;object-fit:cover;}
  .roadgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row;gap:6px 48px;margin-top:8px;}
  .step{margin-bottom:18px;}
  .stat{padding:28px 18px;}
  .stat .n{font-size:40px;}
  .stat .l{font-size:12.5px;}
  .mathtable td{padding:13px 8px;}
  .cta-box{padding:34px 40px;}
  .chrome{padding-left:28px;padding-right:28px;}
  .controls{position:fixed;inset:0;padding:0;pointer-events:none;display:block;}
  .navbtn{pointer-events:auto;position:fixed;top:50%;transform:translateY(-50%);width:54px;height:54px;font-size:24px;}
  #prev{left:72px;}
  #next{right:72px;}
  .cnt{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);}
}
@media (min-width:900px) and (max-height:760px){
  .slide.split .photo img{max-height:48dvh;}
  h2.slide-t{font-size:clamp(26px,3vw,38px);}
}

@media (prefers-reduced-motion:reduce){
  .slide.active .s1,.slide.active .s2,.slide.active .s3,.slide.active .s4,
  .slide.active .s5,.slide.active .s6,.slide.active .s7,.slide.active .s8,
  .hint{animation:none;}
  .pf .st{animation:none;stroke-dashoffset:0;}
  .pf .fl{animation:none;opacity:1;}
}

.ddtable{width:100%;border-collapse:collapse;margin:12px 0 10px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.ddtable th{text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);padding:10px 14px;border-bottom:1px solid var(--line);}
.ddtable td{padding:9px 14px;font-size:14px;border-bottom:1px solid #f0ece2;color:var(--ink);}
.ddtable td:last-child,.ddtable th:last-child{text-align:right;font-weight:600;color:var(--green-deep);}
.ddtable tr.hi td{color:#b8860b;font-weight:700;}
.ddlabel{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#b8860b;font-weight:700;margin-bottom:8px;}
.listen li a{color:var(--green-deep);text-decoration:none;border-bottom:1px solid rgba(43,109,71,.35);}
.listen li .yt{font-size:11px;color:var(--green);display:block;margin-top:3px;}
</style>
</head>

function readLead(){
  const q = new URLSearchParams(location.search);
  if(q.get('p') || q.get('d')){
    return {
      first_name: q.get('n') || '', persona_segment: q.get('p') || '', division: q.get('d') || 'Richmond, VA',
      land_status: q.get('l') || 'unknown', style_preference: q.get('s') || 'one of a kind',
      must_have_spaces: (q.get('k') || '').split('|').filter(Boolean), timeline: q.get('t') || 'unknown',
      region: q.get('r') || '', home_intent: q.get('i') || 'everyday', rset: q.get('x') || ''
    };
  }
  try { return JSON.parse(localStorage.getItem('hp_leads') || '[]')[0] || null; } catch(e){ return null; }
}

// ---------- Deck engine ----------
const slideEls = Array.from(document.querySelectorAll('.slide'));
let cur = 0;
const segs = document.getElementById('segs');
slideEls.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; const f = document.createElement('div'); f.className = 'segfill'; s.appendChild(f); segs.appendChild(s); });
const segEls = Array.from(segs.children);
let autoT = null;
function slideDur(){
  const s = slideEls[cur];
  if(!s.dataset.calcdur){
    const inner = s.querySelector('.inner');
    const words = inner ? inner.innerText.trim().split(/\s+/).length : 30;
    const imgs = s.querySelectorAll('img').length;
    s.dataset.calcdur = Math.min(14000, Math.max(7500, 4200 + words * 100 + imgs * 600));
  }
  return +s.dataset.calcdur;
}
function armAuto(){ clearTimeout(autoT); if(cur < slideEls.length - 1) autoT = setTimeout(() => go(cur + 1), slideDur()); }
function go(i){
  if(i < 0 || i >= slideEls.length) return;
  cur = i;
  slideEls.forEach((s, j) => s.classList.toggle('active', j === cur));
  const last = cur === slideEls.length - 1;
  segEls.forEach((s, j) => {
    const f = s.firstChild; f.style.transition = 'none';
    if(j < cur || (last && j === cur)){ f.style.width = '100%'; }
    else if(j === cur){ f.style.width = '0'; void f.offsetWidth; f.style.transition = 'width ' + slideDur() + 'ms linear'; f.style.width = '100%'; }
    else { f.style.width = '0'; }
  });
  document.getElementById('cnt').textContent = (cur + 1) + ' of ' + slideEls.length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === slideEls.length - 1;
  document.body.classList.toggle('ondark', slideEls[cur].classList.contains('dark'));
  const inner = slideEls[cur].querySelector('.inner'); if(inner) inner.scrollTop = 0;
  armAuto();
}
function step(d){ go(cur + d); }
document.addEventListener('visibilitychange', () => { if(document.hidden) clearTimeout(autoT); else go(cur); });
document.getElementById('deck').addEventListener('click', (e) => { if(e.target.closest('button, a')) return; const x = e.clientX / window.innerWidth; if(x < 0.25) step(-1); else step(1); });
document.addEventListener('keydown', (e) => { if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); step(1); } if(e.key === 'ArrowLeft') { e.preventDefault(); step(-1); } });
let tx = null, ty = null;
document.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
document.addEventListener('touchend', (e) => { if(tx === null) return; const dx = e.changedTouches[0].clientX - tx; const dy = e.changedTouches[0].clientY - ty; if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){ if(dx < 0) step(1); else step(-1); } tx = null; ty = null; }, {passive: true});
go(0);
</script>
